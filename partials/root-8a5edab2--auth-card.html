<main class="pac-main">
  <div class="pac-main__inner">
    <div class="pac-gateway">
      <section class="pac-auth-card" aria-label="Selección de banca virtual">
        <div class="pac-form">
          <p class="pac-welcome">¡Bienvenido!<br><br></p>
          <div class="pac-symbol-block">
            <img class="pac-symbol" src="assets/images/access-symbol.webp" alt="Logo">
            <p class="pac-caption">Para comenzar, seleccione una opción</p>
          </div>
          <div class="pac-choices">
            <button class="pac-choice" type="button" data-pac-go="personal">Banca Virtual Personas</button>
            <div class="pac-choice-gap" aria-hidden="true"></div>
            <button class="pac-choice" type="button" data-pac-go="business">Banca Virtual Empresas</button>
          </div>
        </div>
      </section>
    </div>
    <div class="pac-tail" aria-hidden="true"></div>
  </div>
</main>

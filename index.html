<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="apple-itunes-app" content="app-id=880551607">
  <title>Intermatic</title>
  <link rel="shortcut icon" href="assets/icons/pacifico.ico" type="image/x-icon">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/sections/root-8a5edab2--backdrop.css">
  <link rel="stylesheet" href="styles/sections/root-8a5edab2--masthead.css">
  <link rel="stylesheet" href="styles/sections/root-8a5edab2--auth-card.css">
  <link rel="stylesheet" href="styles/sections/root-8a5edab2--footer.css">
</head>
<body data-titulo="titulo-inicio">
  <div class="pac-viewport">
    <div class="pac-stage" aria-hidden="true"></div>
    <div class="pac-frame">
      <div class="pac-strip">
        <nav class="pac-shortcuts" aria-label="Navegación principal">
          <a class="pac-shortcuts__link" href="index.html" data-t="inicio"></a>
        </nav>
      </div>
      <header class="pac-brand">
        <h1 class="pac-brand__title" data-t="intermatico-titulo"></h1>
      </header>
    </div>
    <main class="pac-main">
      <div class="pac-main__inner">
        <div class="pac-gateway">
          <section class="pac-auth-card" aria-label="Selección de banca virtual">
            <div class="pac-form">
              <p class="pac-welcome" data-t="bienvenido-landing"></p>
              <div class="pac-symbol-block">
                <img class="pac-symbol" src="assets/images/access-symbol.webp" alt="Logo">
                <p class="pac-caption" data-t="para-comenzar"></p>
              </div>
              <div class="pac-choices">
                <button class="pac-choice" type="button" data-pac-view="personas" data-t="banca-personas"></button>
                <div class="pac-choice-gap" aria-hidden="true"></div>
                <button class="pac-choice" type="button" data-pac-view="empresas" data-t="banca-empresas"></button>
              </div>
            </div>
          </section>
        </div>
        <div class="pac-tail" aria-hidden="true"></div>
      </div>
    </main>
  </div>
  <footer class="pac-footer">
    <div class="pac-footer__rule"></div>
    <div class="pac-footer__inner">
      <div class="pac-footer__compat">
        <br><span data-t="compat-empresas"></span> <br class="pac-clear"><span data-t="copyright-empresas"></span>
      </div>
      <div class="pac-footer__spacer"></div>
      <div class="pac-footer__security">
        <strong><a class="pac-footer__link" href="https://www.intermatico.com/Usuario/SeguridadPrincipal" data-t="por-su-seguridad"></a></strong>
        <br class="pac-clear">
        <span data-t="verifica-direccion"></span> <br>
        <a class="pac-footer__link" href="terminos/" data-t="terminos-link"></a>
      </div>
    </div>
  </footer>
  <script src="scripts/textos.js"></script>
  <script src="scripts/sections/root-8a5edab2--backdrop.js"></script>
  <script src="scripts/sections/root-8a5edab2--auth-gate.js"></script>
  <script src="scripts/main.js"></script>
</body>
</html>
